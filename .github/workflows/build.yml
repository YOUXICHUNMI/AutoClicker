name: Build

# 触发方式：
#   - 推送到 cpp-main（默认分支，C++ 版）或 main
#   - 打 v* 标签 —— 直接用标签名做版本号
#   - 手动触发
#
# 每次运行都会发/更新一个 Release（见最后一个 job）：
#   - 分支推送 → 滚动发布，标签取 CMakeLists.txt 里的 VERSION（如 v1.0.0），
#                内容随每次推送刷新，方便直接下载最新产物
#   - tag 推送 → 用该 tag 发布正式版
on:
  push:
    branches: [ cpp-main, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ cpp-main, main ]
  workflow_dispatch:

permissions:
  contents: write        # 创建 / 更新 Release 需要

jobs:
  # ==========================================================
  #  Windows：单文件 exe（Enigma Virtual Box）+ 绿色目录 zip
  # ==========================================================
  windows:
    name: Windows (single exe + green dir)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $m = Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)'
            if (-not $m) { throw 'CMakeLists.txt 里找不到 VERSION' }
            $ver = $m.Matches[0].Groups[1].Value
          }
          "value=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本号: $ver"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_mingw
          # 必须装配套的 mingw 工具链。runner 镜像自带的 C:\mingw64 是 GCC 15，
          # 与 Qt 6.8.2 的 mingw_64（GCC 13.1）ABI 不匹配，链接 Qt6EntryPoint.a
          # 会报 undefined reference to `__imp___argc`。只装 Qt 不装工具链就会踩。
          tools: 'tools_mingw1310'
          cache: true

      - name: Install Ninja
        run: choco install ninja -y

      # Enigma Virtual Box 用于打单文件 exe；装不上就只出绿色目录形态
      - name: Install Enigma Virtual Box
        shell: pwsh
        continue-on-error: true
        run: |
          $url = 'https://enigmaprotector.com/assets/files/enigmavb.exe'
          $out = Join-Path $env:RUNNER_TEMP 'enigmavb.exe'
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          Start-Process -FilePath $out -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\EnigmaVB' -Wait
          if (Test-Path 'C:\EnigmaVB\enigmavbconsole.exe') { Write-Host 'EnigmaVB ready' }
          else { Write-Warning 'EnigmaVB 未装上，单文件 exe 会被跳过' }

      # 走项目自己的打包脚本，保证 CI 与本地产出一致。
      # 注意：C++ 版 package.ps1 没有 -SkipReadme（那是 Python 版的参数），
      # 传了会直接 NamedParameterNotFound 挂掉。
      - name: Package
        shell: pwsh
        run: |
          $env:ENIGMAVB_DIR = 'C:\EnigmaVB'
          # 用哈希表 splat 而不是数组 splat。
          # 数组 splat 传给 .ps1 文件时不做参数名解析，'-Force' 会被当成
          # -Version 的位置实参（CI 里表现为「版本: -Force」），是个安静错绑。
          # QtDir 显式传：install-qt-action 只设 QT_ROOT_DIR，不设
          # CMAKE_PREFIX_PATH/QTDIR，脚本的自动探测扫不到 actions 的安装位。
          $pkgArgs = @{
            Force   = $true
            Version = '${{ steps.ver.outputs.value }}'
            QtDir   = $env:QT_ROOT_DIR
          }
          if (-not (Test-Path 'C:\EnigmaVB\enigmavbconsole.exe')) { $pkgArgs.SkipSingle = $true }

          # 强制用 Qt 配套的 mingw 编译器。PATH 里 runner 自带的 C:\mingw64 排在前面，
          # 光靠 PATH 顺序不可靠，所以直接给 CMake 指定 CC/CXX（首次 configure 读取）。
          $qtBase = Split-Path (Split-Path $env:QT_ROOT_DIR -Parent) -Parent
          $gxx = Get-ChildItem (Join-Path $qtBase 'Tools') -Directory -Filter 'mingw*' -ErrorAction SilentlyContinue |
                 ForEach-Object { Join-Path $_.FullName 'bin\g++.exe' } |
                 Where-Object { Test-Path $_ } |
                 Select-Object -First 1
          if ($gxx) {
            $env:CXX = $gxx
            $env:CC  = Join-Path (Split-Path $gxx -Parent) 'gcc.exe'
            Write-Host "编译器: $($env:CXX)"
          } else {
            Write-Warning '没找到 Qt 配套的 mingw 工具链，回退到 PATH 里的 g++'
          }

          ./script/package.ps1 @pkgArgs

      - name: Show dist
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # ==========================================================
  #  Linux：CMake + Qt6 编译，产单文件 + 绿色目录 tar.gz
  #  （连点/热键等 Win32 功能由 Q_OS_WIN 守卫关闭，界面可读可用）
  # ==========================================================
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(grep -m1 -oE 'VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          fi
          [ -n "$VER" ] || { echo '取不到版本号'; exit 1; }
          echo "value=$VER" >> "$GITHUB_OUTPUT"
          echo "版本号: $VER"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            qt6-base-dev libgl1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/release --parallel

      - name: Verify binary
        run: |
          test -x build/release/AutoClicker
          file build/release/AutoClicker

      - name: Package archives
        env:
          VER: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          STAMP="$(date +%Y%m%d)"
          mkdir -p dist

          # 单文件：Linux 上就是那个可执行文件本身（Qt 依赖由系统提供）
          cp build/release/AutoClicker "dist/AutoClicker_v${VER}_${STAMP}_single_linux64"

          # 绿色目录：可执行文件 + 所有运行时依赖，解压即用
          GREEN="build/green/AutoClicker"
          mkdir -p "$GREEN"
          cp build/release/AutoClicker "$GREEN/"
          # 把需要的 Qt 与编译器运行时库一起带上（ldd 过滤系统自带的 glibc 等）
          ldd build/release/AutoClicker \
            | awk '{ if ($2 == "=>") print $3; else if ($1 ~ /^\//) print $1 }' \
            | while read -r so; do
                [ -f "$so" ] || continue
                case "$so" in
                  /lib/x86_64-linux-gnu/libc.so*|/lib/x86_64-linux-gnu/libm.so*|\
                  /lib/x86_64-linux-gnu/libpthread.so*|/lib64/ld-linux*) continue ;;
                esac
                cp -n "$so" "$GREEN/" || true
              done
          tar -czf "dist/AutoClicker_v${VER}_${STAMP}_linux64.tar.gz" -C build/green AutoClicker

          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-linux
          path: |
            dist/AutoClicker_v*_single_linux64
            dist/AutoClicker_v*_linux64.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ==========================================================
  #  发布 Release
  #    - 分支推送 → 滚动发布（tag = v<CMakeLists 里的 VERSION>），内容每次刷新
  #    - tag 推送 → 用该 tag 发正式版
  #  任一平台构建失败也照常发布另一端已成功的产物（always()）。
  # ==========================================================
  release:
    name: Release
    needs: [ windows, linux ]
    if: ${{ always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="${GITHUB_REF_NAME}"
            NOTES_FROM_TAGS="true"
          else
            VER="$(grep -m1 -oE 'VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
            [ -n "$VER" ] || { echo '取不到版本号'; exit 1; }
            TAG="v${VER}"
            NAME="v${VER} (${GITHUB_REF_NAME} ${GITHUB_SHA:0:7})"
            NOTES_FROM_TAGS="false"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES_FROM_TAGS" >> "$GITHUB_OUTPUT"
          echo "发布标签: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          pattern: AutoClicker-*
          merge-multiple: true

      - name: Check files
        run: |
          set -euo pipefail
          ls -lh out
          if [ -z "$(ls -A out)" ]; then
            echo '::error::没有任何产物可发布（两个平台都失败了？）'
            exit 1
          fi

      # 分支推送时 tag 固定是 v<VERSION>，同一 tag 会被反复发布。
      # action-gh-release 只追加不清理，于是旧日期的产物会一直堆在同一个
      # Release 里（实测出现过 20261123 与 20261126 两批并存）。发布前先把
      # 该 tag 下已有的产物删掉，只保留本次构建的结果。
      # 只删 assets，不删 Release/tag —— tag 推送时 tag 必须保持不动。
      - name: Clean old assets
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "还没有 Release $TAG，跳过清理"
            exit 0
          fi
          echo "已有 Release $TAG，清理旧产物："
          gh release view "$TAG" --json assets -q '.assets[].name' | while read -r n; do
            [ -n "$n" ] || continue
            echo "  - 删除 $n"
            gh release delete-asset "$TAG" "$n" -y
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: out/*
          generate_release_notes: ${{ steps.meta.outputs.notes == 'true' }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            自动构建产物。

            - 提交：${{ github.sha }}
            - 分支：${{ github.ref_name }}
            - 平台：Windows（单文件 exe + 绿色目录 zip）、Linux（单文件 + tar.gz）
